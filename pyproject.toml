[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-analysis-mcp"
version = "0.1.0"
description = "tax-analysis-engine 的 MCP 适配器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.8,<5",
    "requests>=2.25,<3",
    "urllib3>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tax-analysis-mcp = "tax_engine_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
