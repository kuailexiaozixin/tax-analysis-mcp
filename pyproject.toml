[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-analysis-mcp"
version = "0.2.2"
description = "给 MCP 客户端用的税务分析工具集：19 个只读工具、法规检索与分层底稿、成稿模板 prompt。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.8,<5",
    "requests>=2.25,<3",
    "urllib3>=1.26,<3",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tax-analysis-mcp = "tax_engine_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_engine_mcp = [
    "runtime/MANIFEST.json",
    "runtime/scripts/*.py",
    "runtime/data/*.json",
    "runtime/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
